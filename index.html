<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip">
<meta name="theme-color" content="#0B2A25">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Trip</title>
<style>
:root{--bg:#F4F6F5;--card:#FFFFFF;--ink:#10261F;--mute:#4F635A;--line:#C8D5CD;--accent:#0E5AD0;--bad:#B2331B}
@media (prefers-color-scheme:dark){:root{--bg:#0C1513;--card:#15211E;--ink:#EAF4EF;--mute:#A5C2B7;--line:#2F4640;--accent:#7FB0FF;--bad:#FF9D8A}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#lock{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
#lock[hidden]{display:none}
h1{font-size:22px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
p{margin:0 0 16px;color:var(--mute);font-size:15px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
button{width:100%;margin-top:12px;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px/1 inherit;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0C1513}}
button:disabled{opacity:.6}
#msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--bad)}
#wait{color:var(--mute);font-size:15px}
</style>
</head>
<body>
<div id="wait">Opening</div>
<form id="lock" hidden autocomplete="off">
<h1>This page is locked</h1>
<p>Enter the passphrase you were given. This phone will remember it.</p>
<label for="pw">Passphrase</label>
<input id="pw" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">
<button id="go" type="submit">Open</button>
<div id="msg" role="alert"></div>
</form>
<script>
(function(){
var SALT="asZDzUFBxGS5dDyM/jf5PA==",ITER=600000,KEYNAME="cr26.k";
var $=function(i){return document.getElementById(i)};
function b64d(s){s=atob(s);var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function b64e(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
function importRaw(u){return crypto.subtle.importKey("raw",u,{name:"AES-GCM"},true,["encrypt","decrypt"])}
function derive(pass){pass=String(pass).trim().toLowerCase().replace(/\s+/g,"");
 return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]).then(function(k){
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(SALT),iterations:ITER,hash:"SHA-256"},k,256)}).then(function(bits){return new Uint8Array(bits)})}
var blob=null;
function getBlob(){if(blob)return Promise.resolve(blob);return fetch("trip.enc",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("fetch");return r.arrayBuffer()}).then(function(b){blob=new Uint8Array(b);return blob})}
function open(raw){return Promise.all([importRaw(raw),getBlob()]).then(function(a){var key=a[0],u=a[1];
 return crypto.subtle.decrypt({name:"AES-GCM",iv:u.subarray(0,12)},key,u.subarray(12)).then(function(pt){
  var d=JSON.parse(new TextDecoder().decode(pt));store(KEYNAME,b64e(raw));
  window.TRIPCFG=d.cfg&&d.cfg.token?{repo:d.cfg.repo,token:d.cfg.token,key:key}:null;
  document.open();document.write(d.html);document.close()})})}
function ask(text){$("wait").hidden=true;$("wait").style.display="none";$("lock").hidden=false;$("msg").textContent=text||"";$("go").disabled=false;$("go").textContent="Open"}
function fromPass(p,quiet){return derive(p).then(open).catch(function(e){ask(e&&e.message==="fetch"?"The page could not be loaded. Check the signal and try again.":quiet?"":"That passphrase did not open the page. Check it and try again.")})}
$("lock").addEventListener("submit",function(e){e.preventDefault();var p=$("pw").value;if(!p.trim())return;$("go").disabled=true;$("go").textContent="Opening";$("msg").textContent="";fromPass(p,false)});
if(!window.crypto||!crypto.subtle){ask("This browser cannot open the page. Use Safari or Chrome.");return}
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
var m=/[#&]k=([^&]+)/.exec(location.hash),saved=read(KEYNAME);
function tryHash(){if(m)fromPass(decodeURIComponent(m[1]),true);else ask("")}
if(saved){var raw;try{raw=b64d(saved)}catch(e){raw=null}
 if(raw)open(raw).catch(function(e){if(e&&e.message==="fetch"){ask("The page could not be loaded. Check the signal and try again.")}else{store(KEYNAME,null);tryHash()}});else tryHash()}
else tryHash();
})();
</script>
</body>
</html>
